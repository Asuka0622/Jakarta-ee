        <tr><td>生命周期</td>
            <td>init 一次、service 每请求调一次、destroy 一次；

            <td>一个实例被多线程共享，别用可变成员变量存用户数据；

        <tr><td>中文编码</td>

            <td>服务端内部跳转，1 次请求，地址栏不变，能共享 request 域数据，

            <td>任何用户能控制的内容，输出到 HTML 前都要转义

    <!-- ===== 已注释：一个请求是怎么走完的（以访问 /hello 为例） =====
    <h2>4. 一个请求是怎么走完的</h2>

    <p>以访问 http://localhost:8080/demo1_war_exploded/hello 为例：</p>

    <div class="flow">
        <div class="box"><b>浏览器</b><span>发起 HTTP 请求</span></div>
        <div class="arrow">→</div>
        <div class="box"><b>Tomcat</b><span>接收连接、解析请求</span></div>
        <div class="arrow">→</div>
        <div class="box"><b>URL 匹配</b><span>用 /hello 找到对应 Servlet</span></div>
        <div class="arrow">→</div>
        <div class="box"><b>HelloServlet</b><span>执行 doGet()</span></div>
        <div class="arrow">→</div>
        <div class="box"><b>响应</b><span>HTML 写回浏览器</span></div>
    </div>

    <p>关键点：Servlet 是 Tomcat 创建和调用的，不是浏览器直接 new 出来的。
       浏览器只认 URL，Tomcat 负责把 URL 翻译成「该调用哪个 Java 类」，
       依据就是 @WebServlet("/hello") 注解或者 web.xml 里的映射。</p>
    -->

    <!-- ===== 已注释：一个 Servlet 的最小结构（骨架 + 编号说明） =====
    <h2>6. 一个 Servlet 的最小结构</h2>

    <p>这是最精简的写法，去掉所有业务逻辑，只剩骨架，编号对应下面的说明。
       代码区里的尖括号写成了 HTML 转义形式（&lt; 代表小于号），
       否则浏览器会把它们当成标签解析。</p>

<pre>@WebServlet("/hello")                                  // ① 注册访问路径
public class HelloServlet extends HttpServlet {        // ② 必须继承 HttpServlet

    @Override
    protected void doGet(HttpServletRequest req,        // ③ 请求对象：读参数、读请求头
                         HttpServletResponse resp)      // ④ 响应对象：写状态码、写内容
            throws ServletException, IOException {

        resp.setContentType("text/html;charset=UTF-8"); // ⑤ 先声明返回类型与编码

        try (PrintWriter out = resp.getWriter()) {      // ⑥ 拿到输出流，用完自动关闭
            out.println("&lt;h1&gt;Hello Servlet&lt;/h1&gt;");  // ⑦ 写入返回给浏览器的内容
        }
    }
}</pre>

    <table>
        <tr><th>编号</th><th>说明</th><th>少了会怎样</th></tr>
        <tr><td>① @WebServlet</td>
            <td>告诉容器这个类负责哪个 URL；等价于 web.xml 里的 servlet-mapping</td>
            <td>容器不知道该把请求交给谁，访问得到 404</td></tr>
        <tr><td>② extends HttpServlet</td>
            <td>继承 HttpServlet 才能被容器识别为 Servlet</td>
            <td>注解写了也没用，容器不认</td></tr>
        <tr><td>③④ req / resp</td>
            <td>一个读请求、一个写响应，方法签名固定，不要改参数类型</td>
            <td>方法不会被调用，退化成 405 方法不允许</td></tr>
        <tr><td>⑤ setContentType</td>
            <td>声明返回 HTML、编码 UTF-8，必须在取 Writer 之前调用</td>
            <td>中文乱码；浏览器可能把 HTML 当纯文本显示</td></tr>
        <tr><td>⑥ try-with-resources</td>
            <td>块结束自动 close()，异常时也关，避免连接泄漏</td>
            <td>需要手写 finally 关闭，容易漏</td></tr>
        <tr><td>⑦ out.println</td>
            <td>往里写的内容就是浏览器的页面源码</td>
            <td>页面一片空白</td></tr>
    </table>
    -->

    <!-- ===== 已注释：Servlet 生命周期（它也是「单例多线程」的根源） =====
    <h2>7. Servlet 生命周期</h2>

    <ul>
        <li><b>类加载 + 实例化</b>：容器创建 Servlet 对象，整个应用只创建一次</li>
        <li><b>init()</b>：初始化，只调用一次。适合读配置、建连接池</li>
        <li><b>service()</b>：每次请求都调用，内部再按请求方法分发到 doGet / doPost</li>
        <li><b>doGet() / doPost()</b>：你真正写业务逻辑的地方</li>
        <li><b>destroy()</b>：应用停止时调用一次，用来释放资源</li>
    </ul>

    <p>为什么要记住它：容器只创建一个对象，但每个请求由一个独立线程处理，
       多个用户共用同一个对象，所以可变的成员变量绝不能用来存某个用户的数据。
       想亲眼看效果，可先按 LifecycleServlet.java 顶部说明启用该 Servlet，
       再访问 /lifecycle 反复刷新，观察「init 时间不变、请求序号一直涨」。</p>
    -->
